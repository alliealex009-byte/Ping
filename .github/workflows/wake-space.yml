name: Keep Space awake (real browser visit)
on:
  schedule:
    - cron: "*/10 * * * *"      # every 30 minutes
  workflow_dispatch: {}
jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wake through the API if it is sleeping
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ vars.SPACE_ID }}
        run: python wake_space.py
      - name: Visit the Space like a person (Chromium)
        env:
          SPACE_ID: ${{ vars.SPACE_ID }}
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python browser_visit.py
